<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" className="rounded-lg bg-[#0B0C0E]">
  <defs>
    <linearGradient id="bassFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.25" />
    </linearGradient>
    <radialGradient id="dropletFlame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="1" />
      <stop offset="60%" stop-color="#F97316" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2" />
    </radialGradient>
  </defs>

  <text x="40" y="45" fill="#F3F2EF" font-family="system-ui, sans-serif" font-size="18" font-weight="600">NASA BASS-II Microgravity Flow Duct</text>
  <text x="40" y="70" fill="#9EA2A7" font-family="system-ui, sans-serif" font-size="12">ISS Microgravity Science Glovebox (MSG) Test Section</text>

  <!-- Flow Chamber -->
  <rect x="140" y="115" width="520" height="180" rx="8" fill="url(#bassFlow)" stroke="#303134" stroke-width="2" />

  <!-- Flow Nozzle -->
  <g transform="translate(160, 135)">
    <rect x="0" y="0" width="20" height="140" rx="3" fill="#191A1D" stroke="#10B981" stroke-width="1.5" />
    <path d="M 35 45 L 75 45 M 65 40 L 75 45 L 65 50" stroke="#10B981" stroke-width="2" fill="none" />
    <path d="M 35 95 L 75 95 M 65 90 L 75 95 L 65 100" stroke="#10B981" stroke-width="2" fill="none" />
    <text x="55" y="75" fill="#9EA2A7" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">0.4 - 40 cm/s</text>
  </g>

  <!-- Sample Mount (PMMA Rod/Sheet) -->
  <g transform="translate(320, 165)">
    <rect x="0" y="30" width="180" height="15" rx="3" fill="#374151" stroke="#DDA36B" stroke-width="1.5" />
    <text x="90" y="65" fill="#F3F2EF" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">PMMA Rod (0.25 - 0.5 in) / Thin Film</text>
    
    <!-- Spherical / Opposed Flame -->
    <circle cx="40" cy="37" r="28" fill="url(#dropletFlame)" />
    <text x="40" y="10" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Quenched / Blowoff Limits</text>
  </g>

  <!-- Camera & Imaging System -->
  <g transform="translate(540, 140)">
    <rect x="0" y="10" width="100" height="120" rx="6" fill="#111214" stroke="#4B5563" stroke-width="1.5" />
    <text x="50" y="35" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DIAGNOSTICS</text>
    <text x="15" y="60" fill="#9EA2A7" font-family="system-ui, sans-serif" font-size="10">• High-Speed Video</text>
    <text x="15" y="80" fill="#9EA2A7" font-family="system-ui, sans-serif" font-size="10">• Radiometer Array</text>
    <text x="15" y="100" fill="#9EA2A7" font-family="system-ui, sans-serif" font-size="10">• Nitrogen Jet Injector</text>
  </g>

  <text x="40" y="360" fill="#737F8C" font-family="system-ui, sans-serif" font-size="11">NASA Glenn Research Center · BASS-II MSG Flight Experiment (Bhattacharjee et al. 2016)</text>
</svg>
