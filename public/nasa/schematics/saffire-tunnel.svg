<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" className="rounded-lg bg-[#0B0C0E]">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#EF4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Title & Context -->
  <text x="40" y="45" fill="#F3F2EF" font-family="system-ui, sans-serif" font-size="18" font-weight="600">NASA Saffire Flight Flow Tunnel</text>
  <text x="40" y="70" fill="#9EA2A7" font-family="system-ui, sans-serif" font-size="12">Cygnus Resupply Vehicle Cargo Bay (0.4 m × 1.0 m Flow Duct)</text>

  <!-- Outer Duct -->
  <rect x="120" y="110" width="560" height="190" rx="8" fill="url(#flowGrad)" stroke="#303134" stroke-width="2" />

  <!-- Inlet Fans & Flow Straightener -->
  <g transform="translate(140, 130)">
    <rect x="0" y="0" width="25" height="150" rx="4" fill="#191A1D" stroke="#3B82F6" stroke-width="1.5" />
    <text x="12" y="80" fill="#3B82F6" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle" transform="rotate(-90 12 80)">INTAKE FANS</text>
    
    <!-- Flow arrows -->
    <path d="M 40 40 L 80 40 M 70 35 L 80 40 L 70 45" stroke="#3B82F6" stroke-width="2" fill="none" />
    <path d="M 40 75 L 80 75 M 70 70 L 80 75 L 70 80" stroke="#3B82F6" stroke-width="2" fill="none" />
    <path d="M 40 110 L 80 110 M 70 105 L 80 110 L 70 115" stroke="#3B82F6" stroke-width="2" fill="none" />
    <text x="60" y="98" fill="#9EA2A7" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">20 cm/s</text>
  </g>

  <!-- Test Sample Card -->
  <g transform="translate(280, 160)">
    <rect x="0" y="30" width="220" height="30" rx="2" fill="#26272B" stroke="#DDA36B" stroke-width="2" />
    <text x="110" y="50" fill="#F3F2EF" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="500">SIBAL Fabric / PMMA Card</text>
    
    <!-- Flame Front -->
    <ellipse cx="60" cy="30" rx="45" ry="22" fill="url(#flameGrad)" />
    <circle cx="50" cy="30" r="10" fill="#FDE68A" opacity="0.8" />
    <text x="60" y="10" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Steady 0g Flame Front</text>
  </g>

  <!-- Sensors & Diagnostics Array -->
  <g transform="translate(540, 130)">
    <rect x="0" y="10" width="110" height="130" rx="6" fill="#111214" stroke="#4B5563" stroke-width="1.5" />
    <text x="55" y="35" fill="#DDA36B" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DIAGNOSTICS</text>
    <text x="15" y="60" fill="#9EA2A7" font-family="system-ui, sans-serif" font-size="10">• Thermocouple Array</text>
    <text x="15" y="80" fill="#9EA2A7" font-family="system-ui, sans-serif" font-size="10">• Fast Radiometers</text>
    <text x="15" y="100" fill="#9EA2A7" font-family="system-ui, sans-serif" font-size="10">• CO / CO2 Gas Sensors</text>
    <text x="15" y="120" fill="#9EA2A7" font-family="system-ui, sans-serif" font-size="10">• HD Video (29.97 fps)</text>
  </g>

  <!-- Exhaust -->
  <g transform="translate(680, 175)">
    <path d="M 10 25 L 50 25 M 40 20 L 50 25 L 40 30" stroke="#EF4444" stroke-width="2" fill="none" />
    <text x="30" y="50" fill="#9EA2A7" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Exhaust Scrubber</text>
  </g>

  <!-- Footer Tag -->
  <text x="40" y="360" fill="#737F8C" font-family="system-ui, sans-serif" font-size="11">NASA Glenn Research Center · Saffire Flight Flow Tunnel Architecture (Urban et al. 2019 / 2024)</text>
</svg>
