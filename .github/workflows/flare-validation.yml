name: FLARE validation

on:
  pull_request:
  push:
    branches:
      - flare-2026-judging-evidence-upgrade

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
